<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人数当てゲーム</title>
  <style>
    :root {
      /* カラートークン（DESIGN.md と対応。Issue #37 で Android の配色に統一） */
      --color-primary: #1976D2;
      /* Android実機で実測した MaterialTheme.colorScheme.primaryContainer / onPrimaryContainer の値。
         Theme.kt が primary/secondary 以外のロールを上書きしていないため Material3既定（薄紫）のまま。
         DESIGN.md「プロジェクト固有ルール」参照。 */
      --color-primary-container: #EADDFF;
      --color-on-primary-container: #21005D;
      --color-secondary: #FF6F00;
      --color-background: #F5F5F5;
      --color-surface: #FFFFFF;
      --color-surface-alt: #E0E0E0;
      --color-text-primary: #333333;
      --color-text-secondary: #555555;
      --color-text-muted: #888888;
      --color-text-faint: #AAAAAA;
      --color-border: #DDDDDD;
      --color-divider: #EEEEEE;
      --color-error: #D32F2F;
      --color-error-bg: #FFEBEE;
      --color-success: #388E3C;
      --color-warning: #FFA000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: var(--color-background);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: var(--color-surface);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    h1 { font-size: 22px; text-align: center; margin-bottom: 24px; color: var(--color-text-primary); }
    h2 { font-size: 18px; margin-bottom: 16px; color: var(--color-text-primary); }
    .screen { display: none; }
    .screen.active { display: block; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
      font-family: inherit;
      background: var(--color-surface);
    }
    label.field-label { display: block; margin-bottom: 6px; color: var(--color-text-secondary); font-size: 14px; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--color-primary); color: white; }
    .btn-secondary { background: var(--color-surface-alt); color: var(--color-text-primary); }
    .btn-answer { background: var(--color-primary); color: white; font-size: 18px; padding: 18px; }
    .btn-answer.selected { background: var(--color-secondary); }
    .error { color: var(--color-error); font-size: 14px; margin-bottom: 8px; padding: 8px; background: var(--color-error-bg); border-radius: 8px; }
    .info { color: var(--color-text-secondary); font-size: 14px; margin-bottom: 16px; }
    .player-list { list-style: none; }
    .player-list li { padding: 10px; border-bottom: 1px solid var(--color-divider); font-size: 15px; }
    .player-list li:last-child { border-bottom: none; }
    .badge { display: inline-block; background: var(--color-primary); color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    .question-card {
      background: var(--color-primary-container);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    .question-text { font-size: 20px; font-weight: bold; color: var(--color-on-primary-container); }
    .round-info { font-size: 13px; color: var(--color-text-muted); margin-bottom: 8px; }
    .count-bar {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .count-bar span { width: 120px; font-size: 15px; }
    .count-bar .bar-wrap { flex: 1; background: var(--color-divider); border-radius: 4px; height: 12px; margin: 0 8px; }
    .count-bar .bar { background: var(--color-primary); height: 12px; border-radius: 4px; transition: width 0.5s; }
    .count-bar .num { font-weight: bold; font-size: 15px; color: var(--color-primary); }
    .score-card { background: var(--color-primary-container); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .score-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--color-divider); }
    .score-row:last-child { border-bottom: none; }
    .rank { font-size: 20px; width: 36px; }
    .score-pts { font-weight: bold; color: var(--color-primary); }
    .waiting-count { font-size: 14px; color: var(--color-text-muted); text-align: center; margin-top: 8px; }
    .predict-input { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .predict-input input { margin-bottom: 0; }
    .sent-msg { text-align: center; color: var(--color-success); font-size: 15px; padding: 16px; }
    .spinner { text-align: center; color: var(--color-text-muted); padding: 20px; }
  </style>
</head>
<body>
<div class="container">
  <h1>人数当てゲーム</h1>

  <!-- ホーム画面 -->
  <div id="screen-home" class="screen active">
    <!-- 直近参加していたルームへの復帰導線（Issue #49）。playersドキュメントが残っている
         間だけ意味を持つため、実際に復帰できるかはrejoinLastRoom()内でその都度確認する。 -->
    <div id="rejoin-banner" class="score-card" style="display:none;margin-bottom:16px">
      <p class="info" style="margin-bottom:8px">前回参加していたルームがあります</p>
      <button class="btn-primary" id="rejoin-btn" onclick="rejoinLastRoom()"></button>
      <button class="btn-secondary" onclick="dismissRejoinPrompt()">このルームを表示しない</button>
    </div>
    <div id="home-error" class="error" style="display:none"></div>
    <input id="nickname" type="text" placeholder="ニックネーム" maxlength="20">
    <input id="room-id-input" type="text" placeholder="ルームID（参加する場合）" maxlength="10" style="text-transform:uppercase">
    <button class="btn-primary" onclick="joinRoom()">参加する</button>
    <p style="text-align:center;color:var(--color-text-faint);margin:8px 0">または</p>
    <button class="btn-secondary" onclick="goToCreate()">新しくルームを作る（ホスト）</button>
  </div>

  <!-- ルーム作成画面 -->
  <div id="screen-create" class="screen">
    <div id="create-error" class="error" style="display:none"></div>
    <input id="host-name" type="text" placeholder="ホスト名" maxlength="20">
    <label class="field-label" for="category-select">質問カテゴリ</label>
    <select id="category-select">
      <option value="FRIEND">フレンド</option>
      <option value="PARTY">パーティー</option>
      <option value="DEEP">ディープ</option>
      <option value="ALL" selected>なんでも</option>
    </select>
    <button class="btn-primary" onclick="createRoom()">ルームを作成</button>
    <button class="btn-secondary" onclick="showScreen('home')">戻る</button>
  </div>

  <!-- 待機室 -->
  <div id="screen-waiting" class="screen">
    <h2>待機中</h2>
    <p class="info">ルームID: <strong id="display-room-id"></strong></p>
    <p class="info">参加者</p>
    <ul class="player-list" id="player-list"></ul>
    <div id="host-controls" style="display:none;margin-top:16px">
      <p class="waiting-count" id="player-count-msg"></p>
      <button class="btn-primary" id="start-btn" onclick="startGame()" disabled>ゲームを開始する</button>
    </div>
    <p class="waiting-count" id="guest-waiting-msg" style="display:none">ホストがゲームを開始するまでお待ちください</p>
    <button class="btn-secondary" onclick="resetGame()" style="margin-top:16px">退室する</button>
  </div>

  <!-- 回答画面 -->
  <div id="screen-answering" class="screen">
    <div class="round-info" id="answer-round"></div>
    <div class="question-card">
      <div class="question-text" id="answer-question"></div>
    </div>
    <div id="answer-buttons"></div>
    <div id="answer-sent" class="sent-msg" style="display:none">✓ 回答を送信しました。全員の回答を待っています...</div>
  </div>

  <!-- 予測画面 -->
  <div id="screen-predicting" class="screen">
    <div class="round-info" id="predict-round"></div>
    <div class="question-card">
      <div class="question-text" id="predict-question"></div>
    </div>
    <p class="info">どちらの回答を選んだ人が何人いると思いますか？</p>
    <div id="predict-options"></div>
    <div id="predict-sent" class="sent-msg" style="display:none">✓ 予測を送信しました。全員の回答を待っています...</div>
  </div>

  <!-- 結果画面 -->
  <div id="screen-result" class="screen">
    <h2 id="result-title"></h2>
    <div id="answer-counts"></div>
    <div id="my-score-card"></div>
    <div class="score-card">
      <div id="result-scores"></div>
    </div>
    <p class="waiting-count">次のラウンドに自動で進みます...</p>
  </div>

  <!-- 最終結果画面 -->
  <div id="screen-finished" class="screen">
    <h2>ゲーム終了！</h2>
    <div class="score-card">
      <div id="final-scores"></div>
    </div>
    <button class="btn-primary" id="restart-btn" onclick="restartGame()" style="margin-top:16px;display:none">もう一度遊ぶ</button>
    <button class="btn-secondary" onclick="resetGame()" style="margin-top:8px">トップに戻る</button>
  </div>

  <!-- ホスト離脱によるルーム終了画面 -->
  <div id="screen-host-left" class="screen">
    <h2>ルームを終了しました</h2>
    <p class="info" style="text-align:center">ホストが離脱したためルームを終了しました</p>
    <button class="btn-primary" onclick="resetGame()" style="margin-top:16px">トップに戻る</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import {
    getFirestore, doc, collection, setDoc, updateDoc, getDoc, getDocs,
    onSnapshot, serverTimestamp, increment, deleteField, deleteDoc
  } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const app = initializeApp({
    apiKey: "AIzaSyCWkpT6zhxIEpC2YF6u8SZc5Y89jWW6tvQ",
    authDomain: "hitokazu-game.firebaseapp.com",
    projectId: "hitokazu-game",
    storageBucket: "hitokazu-game.firebasestorage.app",
    messagingSenderId: "803714424801",
    appId: "1:803714424801:android:eb741310f92ad70b96bca0"
  });

  const auth = getAuth(app);
  const db = getFirestore(app);

  // 回答・予測フェーズのタイムアウト猶予秒数（通信遅延・端末クロックのズレを吸収するバッファ）
  const TIMEOUT_GRACE_SECONDS = 3;

  // ホスト端末がルームドキュメントにハートビートを書き込む間隔（秒）。
  // 参加者端末はこの3倍の時間ハートビートが更新されなければホスト離脱とみなす。
  // 例: 15秒間隔・5ラウンド(1ラウンド50秒程度)＝約5分のゲームで書き込み回数は約20回。
  // Firestore無料枠（書き込み2万回/日）に対して十分小さい（Issue #15）。
  const HOST_HEARTBEAT_INTERVAL_SECONDS = 15;
  const HOST_HEARTBEAT_TIMEOUT_SECONDS = HOST_HEARTBEAT_INTERVAL_SECONDS * 3;

  // ── ルームの保持期限（Issue #34） ────────────────────────
  // 終了済み（FINISHED / HOST_LEFT）は終了から24時間、それ以外（作成直後の待合室・
  // 再戦直後・ラウンド確定のたび）は基準時刻から6時間で expireAt を更新する。
  // ゲームを遊び続けている限り毎ラウンドの確定で6時間ずつ延長されるため実質失効しない。
  // Firestore の serverTimestamp() は1回の書き込みで「+オフセット」を表現できないため、
  // 端末クロックから計算する（削除は1日1回のバッチ実行のため、多少のクロックずれは吸収される）。
  const ROOM_WAITING_RETENTION_HOURS = 6;
  const ROOM_FINISHED_RETENTION_HOURS = 24;

  function expireAtAfterHours(hours) {
    return new Date(Date.now() + hours * 60 * 60 * 1000);
  }

  // 直近参加していたルームIDをブラウザに保存するためのキー（Issue #49）。
  const LAST_ROOM_STORAGE_KEY = 'hitokazu_last_room_id';

  function saveLastRoom(roomId) {
    try { localStorage.setItem(LAST_ROOM_STORAGE_KEY, roomId); } catch (err) { /* private mode等は無視 */ }
  }
  function loadLastRoom() {
    try { return localStorage.getItem(LAST_ROOM_STORAGE_KEY); } catch (err) { return null; }
  }
  function clearLastRoom() {
    try { localStorage.removeItem(LAST_ROOM_STORAGE_KEY); } catch (err) { /* private mode等は無視 */ }
  }

  let state = {
    uid: null,
    roomId: null,
    isHost: false,
    nickname: '',
    selectedAnswer: null,
    predictionSent: false,
    // 再入室時に、現在のラウンドで既に送信済みの予測（Issue #49）。
    // 新ラウンド開始時（phase==='ANSWERING'かつラウンドが変わった時）にクリアする。
    myPrediction: null,
    currentPhase: null,
    currentRound: 0,
    roomUnsub: null,
    playersUnsub: null,
    autoAdvanceTimer: null,
    answeringTimeoutTimer: null,
    predictingTimeoutTimer: null,
    hostHeartbeatInterval: null,
    hostLeftCheckTimer: null,
    // 直近でタイムアウト監視をスケジュールした（フェーズ:ラウンド:フェーズ開始時刻）の組。
    // 同じ組に対して重複してタイマーを仕込まないようにするためのガード。
    lastScheduledTimeoutKey: null,
    // 直近でホスト離脱監視をスケジュールしたhostHeartbeatAtの値（ミリ秒）。
    lastScheduledHeartbeatAt: null,
    // 直前のenterRoom()が既存メンバーの再入室だったかどうか（Issue #49）。
    // trueの間だけ、ANSWERING突入時の「送信済み回答/予測のクリア」処理をスキップし、
    // primeExistingSubmission()で復元した値を最初のレンダリングに反映させる。
    justRejoined: false,
  };

  // 匿名認証
  await signInAnonymously(auth);
  state.uid = auth.currentUser.uid;

  // ── 招待ページ（backend/web/join/）からの遷移を処理する（Issue #28） ──
  // 招待ページは「ルームが存在しWAITING中であること」の事前確認だけを行い、
  // 実際の参加登録（players ドキュメントの作成）はここに一本化する。
  // ?room=ROOMID&nickname=NICKNAME 付きで遷移してきた場合、ホーム画面の入力欄に
  // 値を差し込んだ上で既存の joinRoom() をそのまま呼ぶ（存在確認・満員判定・
  // players 登録・待合室遷移まで、通常の「参加する」ボタンと同じ経路を通る）。
  const inviteParams = new URLSearchParams(location.search);
  const inviteRoomId = inviteParams.get('room');
  const inviteNickname = inviteParams.get('nickname');
  if (inviteRoomId && inviteNickname) {
    // 再読み込み時に同じ join を繰り返さないよう、処理前にURLからクエリを除去する。
    history.replaceState(null, '', location.pathname);
    document.getElementById('room-id-input').value = inviteRoomId.toUpperCase();
    document.getElementById('nickname').value = inviteNickname;
    joinRoom();
  } else {
    // 招待リンク経由でなければ、直近参加していたルームへの復帰導線を出す（Issue #49）。
    const lastRoomId = loadLastRoom();
    if (lastRoomId) showRejoinPrompt(lastRoomId);
  }

  // グローバル関数
  window.showScreen = showScreen;
  window.goToCreate = () => showScreen('create');
  window.joinRoom = joinRoom;
  window.createRoom = createRoom;
  window.startGame = startGame;
  window.submitAnswer = submitAnswer;
  window.submitPrediction = submitPrediction;
  window.resetGame = resetGame;
  window.restartGame = restartGame;
  window.rejoinLastRoom = rejoinLastRoom;
  window.dismissRejoinPrompt = dismissRejoinPrompt;

  function showRejoinPrompt(roomId) {
    const btn = document.getElementById('rejoin-btn');
    btn.textContent = `ルーム ${roomId} に戻る`;
    document.getElementById('rejoin-banner').style.display = 'block';
  }

  function dismissRejoinPrompt() {
    clearLastRoom();
    document.getElementById('rejoin-banner').style.display = 'none';
  }

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError(id) {
    document.getElementById(id).style.display = 'none';
  }

  // Firestore の nickname 等、ユーザー入力由来の文字列を innerHTML に埋め込む前に
  // 必ず通す。他プレイヤーが書き込んだ nickname は信頼できない入力のため、
  // HTML として解釈されないようエスケープする（保存型XSS対策）。
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function generateRoomId() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({length: 8}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  }

  async function createRoom() {
    const hostName = document.getElementById('host-name').value.trim();
    if (!hostName) return showError('create-error', 'ホスト名を入力してください');
    hideError('create-error');

    const categorySelect = document.getElementById('category-select');
    const category = (categorySelect && categorySelect.value) || 'ALL';

    const roomId = generateRoomId();
    state.roomId = roomId;
    state.isHost = true;
    state.nickname = hostName;

    await setDoc(doc(db, 'rooms', roomId), {
      hostName, hostUid: state.uid,
      status: 'WAITING', currentRound: 0, totalRounds: 5,
      currentQuestion: null, category, createdAt: serverTimestamp(),
      // 参加者が join した直後からホスト離脱判定の基準を持てるよう、作成時点でも書いておく
      // （初回の定期ハートビートが届くまでの間、判定対象がnullで判定をスキップされる隙間を埋める）。
      hostHeartbeatAt: serverTimestamp(),
      // 再戦（restartGame）ごとにインクリメントする世代番号。
      // rounds/{gameCount}_{round} のドキュメントIDに使い、前ゲームの回答と衝突させない（Issue #17）。
      gameCount: 1,
      // 未開始のまま放置されたルームを削除スケジュール関数が回収するための保持期限（Issue #34）。
      expireAt: expireAtAfterHours(ROOM_WAITING_RETENTION_HOURS),
    });
    await setDoc(doc(db, 'rooms', roomId, 'players', state.uid), {
      nickname: hostName, isHost: true, joinedAt: serverTimestamp(),
    });

    enterRoom();
  }

  // players/{uid}が既に存在する場合は「既存メンバーの再入室」として扱い、statusを問わず
  // 入室を許可する。ドキュメントは再作成せず参加人数も増やさない（第三者の途中参加は
  // 従来どおりstatus !== 'WAITING'で拒否する。Android FirebaseRepository.joinRoom()と
  // 同一の判定条件にすること。Issue #49）。
  async function joinRoom() {
    const nicknameInput = document.getElementById('nickname').value.trim();
    const roomId = document.getElementById('room-id-input').value.trim().toUpperCase();
    if (!nicknameInput) return showError('home-error', 'ニックネームを入力してください');
    if (!roomId) return showError('home-error', 'ルームIDを入力してください');
    hideError('home-error');

    const roomRef = doc(db, 'rooms', roomId);
    const roomSnap = await getDoc(roomRef);
    if (!roomSnap.exists()) return showError('home-error', 'ルームが見つかりません');
    const roomData = roomSnap.data();

    const existingPlayer = await getExistingPlayer(roomId);
    if (existingPlayer) {
      if (existingPlayer.isHost) return showError('home-error', 'ホストの復帰には対応していません');
      state.nickname = existingPlayer.nickname || nicknameInput;
      await enterAsExistingMember(roomId, roomRef, roomData, existingPlayer);
      return;
    }

    if (roomData.status !== 'WAITING') return showError('home-error', 'ゲームはすでに開始されています');

    state.roomId = roomId;
    state.isHost = false;
    state.nickname = nicknameInput;

    await setDoc(doc(db, 'rooms', roomId, 'players', state.uid), {
      nickname: nicknameInput, isHost: false, joinedAt: serverTimestamp(),
    });

    enterRoom();
  }

  // players/{uid}を読む。フレッシュな参加者はまだ自分のplayersドキュメントが存在せず、
  // Firestoreルール上isPlayer(roomId)がfalseのためこの読み取り自体が権限エラーになりうる。
  // その場合は「既存メンバーではない」として扱う（Issue #49）。
  async function getExistingPlayer(roomId) {
    try {
      const snap = await getDoc(doc(db, 'rooms', roomId, 'players', state.uid));
      return snap.exists() ? snap.data() : null;
    } catch (err) {
      return null;
    }
  }

  // 既存メンバーとしてルームへ入る共通処理（joinRoom()の再入室分岐・rejoinLastRoom()から
  // 呼ばれる）。現在のフェーズで既に送信済みの回答・予測があれば復元してから入室する。
  async function enterAsExistingMember(roomId, roomRef, roomData, existingPlayer) {
    state.roomId = roomId;
    state.isHost = false;
    state.nickname = existingPlayer.nickname || state.nickname || '';
    await primeExistingSubmission(roomRef, roomData);
    enterRoom();
  }

  // 再入室時、現在のラウンドで既に回答・予測を送信済みなら再入力を求めないために取得する
  // （Issue #49）。ANSWERING/PREDICTING以外のフェーズでは入力の余地がないため取得しない。
  async function primeExistingSubmission(roomRef, roomData) {
    state.selectedAnswer = null;
    state.predictionSent = false;
    state.myPrediction = null;
    state.justRejoined = true;

    const status = roomData.status;
    if (status !== 'ANSWERING' && status !== 'PREDICTING') return;

    const roundId = roundDocId(roomData.gameCount, roomData.currentRound);
    try {
      const answerSnap = await getDoc(doc(db, 'rooms', state.roomId, 'rounds', roundId, 'answers', state.uid));
      if (answerSnap.exists()) {
        const a = answerSnap.data();
        if (a.answer) state.selectedAnswer = a.answer;
        if (a.prediction !== undefined) {
          state.predictionSent = true;
          state.myPrediction = a.prediction;
        }
      }
    } catch (err) {
      console.error('primeExistingSubmission failed', err);
    }
  }

  // ── ルーム再入室（ホーム画面の「ルームXXXXXXXXに戻る」から呼び出す） ──
  // ブラウザに保存されたルームIDを使って復帰する（Issue #49）。参加者として
  // 登録されていない（players/{uid}が無い）場合は新規参加へフォールバックせず、
  // 保存済みルームIDを破棄してエラーを表示する。
  async function rejoinLastRoom() {
    const roomId = loadLastRoom();
    if (!roomId) return;
    hideError('home-error');

    const roomRef = doc(db, 'rooms', roomId);
    let roomSnap;
    try {
      roomSnap = await getDoc(roomRef);
    } catch (err) {
      dismissRejoinPrompt();
      return showError('home-error', 'ルームへの復帰に失敗しました');
    }
    if (!roomSnap.exists()) {
      dismissRejoinPrompt();
      return showError('home-error', 'ルームが見つかりません');
    }
    const roomData = roomSnap.data();

    const existingPlayer = await getExistingPlayer(roomId);
    if (!existingPlayer) {
      dismissRejoinPrompt();
      return showError('home-error', '参加者として登録されていません');
    }
    if (existingPlayer.isHost) {
      dismissRejoinPrompt();
      return showError('home-error', 'ホストの復帰には対応していません');
    }

    await enterAsExistingMember(roomId, roomRef, roomData, existingPlayer);
  }

  // ── ルーム退室（参加者が明示的に呼び出す） ─────────────
  // rooms/{roomId}/players/{uid} を削除する。待合室の参加者一覧・満員判定（joinRoom）・
  // 全員提出判定（submitAnswer/submitPrediction の players.size）から即座に外れる（Issue #33）。
  // ホストの離脱はこの経路では扱わない（呼び出し元でstate.isHostのときは呼ばない。
  // ホスト離脱はハートビート停止検知でルームごと終了させるため、二重の仕組みにしない）。
  // 送信済みの回答・予測（rounds/{gameCount}_{round}/answers/{uid}）は意図的に削除しない
  // （実装コストと挙動変更のリスクを避けるため。Issue #33 で明示した判断）。
  async function leaveRoom() {
    if (!state.roomId || !state.uid) return;
    try {
      await deleteDoc(doc(db, 'rooms', state.roomId, 'players', state.uid));
    } catch (err) {
      console.error('leaveRoom failed', err);
    }
  }

  function enterRoom() {
    // 直近参加していたルームIDを保存する（参加者のみ。ホスト復帰はスコープ外。Issue #49）。
    if (!state.isHost) saveLastRoom(state.roomId);
    document.getElementById('rejoin-banner').style.display = 'none';

    document.getElementById('display-room-id').textContent = state.roomId;
    document.getElementById('host-controls').style.display = state.isHost ? 'block' : 'none';
    document.getElementById('guest-waiting-msg').style.display = state.isHost ? 'none' : 'block';
    showScreen('waiting');
    startObserving();
    // ホスト端末は観測開始と同時に定期ハートビートの送信を始める（フェーズを問わず、
    // 待合室段階からのホスト離脱も検知できるようにするため）。
    if (state.isHost) startHostHeartbeat();
  }

  // ── ホストのハートビート定期送信（ホストのみ） ──────────
  async function sendHostHeartbeat() {
    try {
      await updateDoc(doc(db, 'rooms', state.roomId), { hostHeartbeatAt: serverTimestamp() });
    } catch (err) {
      console.error('sendHostHeartbeat failed', err);
    }
  }

  function startHostHeartbeat() {
    clearInterval(state.hostHeartbeatInterval);
    sendHostHeartbeat();
    state.hostHeartbeatInterval = setInterval(sendHostHeartbeat, HOST_HEARTBEAT_INTERVAL_SECONDS * 1000);
  }

  // ── ホスト離脱によるルーム終了（参加者のみ呼び出し） ──────
  // hostHeartbeatAt の更新が閾値時間止まったと判定した参加者端末が呼び出す。
  // すでにゲームが終了・確定済み（FINISHED/HOST_LEFT）の場合は何もしない
  // （古いハートビート監視タイマーが後から発火した場合の二重確定を防ぐ）。
  async function terminateRoomHostLeft() {
    const roomRef = doc(db, 'rooms', state.roomId);
    const roomSnap = await getDoc(roomRef);
    if (!roomSnap.exists()) return;
    const status = roomSnap.data().status;
    if (status === 'FINISHED' || status === 'HOST_LEFT') return;
    // 終了扱いになるので保持期限を「終了から24時間」に更新する（Issue #34）。
    await updateDoc(roomRef, {
      status: 'HOST_LEFT',
      expireAt: expireAtAfterHours(ROOM_FINISHED_RETENTION_HOURS),
    });
  }

  // ── ホスト離脱監視をスケジュール（参加者のみ） ────────────
  // hostHeartbeatAtが更新されるたびに監視タイマーを仕込み直す（ウォッチドッグ方式）。
  // 次の更新が来る前にタイマーが尽きたら、ホストが離脱したとみなしルームを終了させる。
  function scheduleHostLeftCheck(data) {
    if (state.isHost) return;

    if (data.status === 'FINISHED' || data.status === 'HOST_LEFT') {
      clearTimeout(state.hostLeftCheckTimer);
      state.hostLeftCheckTimer = null;
      state.lastScheduledHeartbeatAt = null;
      return;
    }

    const heartbeatAtMs = (data.hostHeartbeatAt && typeof data.hostHeartbeatAt.toMillis === 'function')
      ? data.hostHeartbeatAt.toMillis()
      : null;
    // 初回のハートビートが届くまでは判定しない（createRoom時に書き込まれるため、
    // 通常はルーム参加直後から値が存在する）。
    if (heartbeatAtMs == null) return;
    if (state.lastScheduledHeartbeatAt === heartbeatAtMs) return;
    state.lastScheduledHeartbeatAt = heartbeatAtMs;

    const deadline = heartbeatAtMs + HOST_HEARTBEAT_TIMEOUT_SECONDS * 1000;
    clearTimeout(state.hostLeftCheckTimer);
    state.hostLeftCheckTimer = setTimeout(() => {
      terminateRoomHostLeft().catch(err => console.error('terminateRoomHostLeft failed', err));
    }, Math.max(0, deadline - Date.now()));
  }

  function startObserving() {
    // プレイヤー監視
    state.playersUnsub = onSnapshot(
      collection(db, 'rooms', state.roomId, 'players'),
      snap => {
        const players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const list = document.getElementById('player-list');
        list.innerHTML = '';
        players.forEach(p => {
          const li = document.createElement('li');
          li.appendChild(document.createTextNode(p.nickname));
          if (p.isHost) {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = 'ホスト';
            li.appendChild(badge);
          }
          list.appendChild(li);
        });
        if (state.isHost) {
          const msg = document.getElementById('player-count-msg');
          msg.textContent = `参加者 ${players.length}人`;
          document.getElementById('start-btn').disabled = players.length < 1;
        }
      }
    );

    // ルーム状態監視
    state.roomUnsub = onSnapshot(doc(db, 'rooms', state.roomId), snap => {
      if (!snap.exists()) return;
      const data = snap.data();
      const phase = data.status;

      // ホストのタイムアウト監視・ホスト離脱監視は、画面再描画の間引き（下の早期return）とは
      // 独立に毎スナップショットで評価する。serverTimestamp()確定時に発火するスナップショットは
      // phase/currentRoundが変化しないため、間引きされると基準時刻を取得し損ねる
      // （ハートビート書き込みはまさにこのケース＝phase・roundを一切変えない）。
      if (state.isHost) {
        scheduleHostTimeouts(data);
        if (phase === 'FINISHED' || phase === 'HOST_LEFT') {
          clearInterval(state.hostHeartbeatInterval);
          state.hostHeartbeatInterval = null;
        }
      } else {
        scheduleHostLeftCheck(data);
      }

      if (phase === state.currentPhase && data.currentRound === state.currentRound) return;
      // 再入室直後の最初のスナップショットでは、primeExistingSubmission()で復元した
      // 送信済み回答/予測をANSWERING分岐のリセットで消してしまわないようにする（Issue #49）。
      const wasJustRejoined = state.justRejoined;
      state.justRejoined = false;
      state.currentPhase = phase;
      state.currentRound = data.currentRound;

      // 直近参加していたルームIDは、ゲーム終了・ホスト離脱が確定したら破棄する
      // （参加者のみ。以後の復帰導線を出さないようにするため。Issue #49）。
      if (!state.isHost && (phase === 'FINISHED' || phase === 'HOST_LEFT')) {
        clearLastRoom();
      }

      if (phase === 'ANSWERING') {
        if (!wasJustRejoined) {
          state.selectedAnswer = null;
          state.predictionSent = false;
          state.myPrediction = null;
        }
        renderAnswering(data);
      } else if (phase === 'PREDICTING') {
        renderPredicting(data);
      } else if (phase === 'RESULT') {
        renderResult(data);
        if (state.isHost) {
          clearTimeout(state.autoAdvanceTimer);
          state.autoAdvanceTimer = setTimeout(() => advanceToNextRound(data), 10000);
        }
      } else if (phase === 'FINISHED') {
        renderFinished(data);
      } else if (phase === 'HOST_LEFT') {
        renderHostLeft();
      } else if (phase === 'WAITING') {
        // ホストの「もう一度遊ぶ」（restartGame）で FINISHED → WAITING に戻った場合、
        // ルームID再入力・QR再スキャンなしで全員を自動的に待合室へ戻す（Issue #17）。
        clearTimeout(state.autoAdvanceTimer);
        document.getElementById('display-room-id').textContent = state.roomId;
        document.getElementById('host-controls').style.display = state.isHost ? 'block' : 'none';
        document.getElementById('guest-waiting-msg').style.display = state.isHost ? 'none' : 'block';
        showScreen('waiting');
      }
    });
  }

  const TOTAL_ROUNDS_PER_GAME = 5;

  // ルーム作成時に選べる質問カテゴリと、対応する質問タグ。
  // Android の QuestionCategory（data/model/Models.kt）と同一の表記・絞り込み仕様にすること（Issue #12）。
  const CATEGORY_TAGS = {
    FRIEND: ['friend'],
    PARTY: ['party'],
    DEEP: ['deep'],
    ALL: ['friend', 'party', 'deep'],
  };

  function categoryTags(categoryName) {
    return CATEGORY_TAGS[categoryName] || CATEGORY_TAGS.ALL;
  }

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // rounds サブコレクションのドキュメントID。gameCount を含めることで、restartGame() 後の
  // 2ゲーム目が前ゲームの rounds/{round}/answers と衝突しないようにする（Issue #17）。
  // Android（FirebaseRepository.roundDocId）と同じ形式にすること。
  function roundDocId(gameCount, round) {
    return `${gameCount || 1}_${round}`;
  }

  async function startGame() {
    const roomRef = doc(db, 'rooms', state.roomId);
    const roomSnap = await getDoc(roomRef);
    const roomData = roomSnap.data() || {};
    const tags = categoryTags(roomData.category);
    const filtered = ALL_QUESTIONS.filter(q => q.tags.some(t => tags.includes(t)));
    const pool = filtered.length > 0 ? filtered : ALL_QUESTIONS;
    let questionQueue = shuffleArray(pool).slice(0, TOTAL_ROUNDS_PER_GAME);

    // 再戦時、前ゲーム最後の質問がそのまま1問目にならないよう、可能なら入れ替える（Issue #17）。
    const avoidQuestionId = roomData.lastPlayedQuestionId;
    if (avoidQuestionId && questionQueue[0] && questionQueue[0].questionId === avoidQuestionId) {
      const altIndex = questionQueue.findIndex(q => q.questionId !== avoidQuestionId);
      if (altIndex > 0) {
        [questionQueue[0], questionQueue[altIndex]] = [questionQueue[altIndex], questionQueue[0]];
      } else {
        const usedIds = new Set(questionQueue.map(q => q.questionId));
        const replacement = pool.find(q => q.questionId !== avoidQuestionId && !usedIds.has(q.questionId));
        if (replacement) questionQueue = [replacement, ...questionQueue.slice(1)];
      }
    }

    await updateDoc(roomRef, {
      status: 'ANSWERING', currentRound: 1,
      totalRounds: questionQueue.length,
      questionQueue: questionQueue,
      currentQuestion: questionQueue[0], startedAt: serverTimestamp(),
      phaseStartedAt: serverTimestamp(),
      lastPlayedQuestionId: deleteField(),
    });
  }

  function renderAnswering(data) {
    const q = data.currentQuestion;
    document.getElementById('answer-round').textContent = `第${data.currentRound}問 / 全${data.totalRounds}問`;
    document.getElementById('answer-question').textContent = q.text;

    const btns = document.getElementById('answer-buttons');
    btns.innerHTML = q.options.map(opt =>
      `<button class="btn-answer" onclick="submitAnswer('${opt}')">${opt}</button>`
    ).join('');

    // 再入室時に既に回答送信済みの場合、再入力を求めず送信済みの状態を直接表示する（Issue #49）。
    if (state.selectedAnswer) {
      document.querySelectorAll('.btn-answer').forEach(b => {
        b.disabled = true;
        if (b.textContent === state.selectedAnswer) b.classList.add('selected');
      });
      document.getElementById('answer-sent').style.display = 'block';
    } else {
      document.getElementById('answer-sent').style.display = 'none';
    }
    showScreen('answering');
  }

  async function submitAnswer(answer) {
    if (state.selectedAnswer) return;
    state.selectedAnswer = answer;

    document.querySelectorAll('.btn-answer').forEach(b => {
      b.disabled = true;
      if (b.textContent === answer) b.classList.add('selected');
    });
    document.getElementById('answer-sent').style.display = 'block';

    const roomRef = doc(db, 'rooms', state.roomId);
    const roomData = (await getDoc(roomRef)).data();
    const currentRound = roomData.currentRound;
    const roundId = roundDocId(roomData.gameCount, currentRound);
    const roundRef = doc(db, 'rooms', state.roomId, 'rounds', roundId);
    const answerRef = doc(db, 'rooms', state.roomId, 'rounds', roundId, 'answers', state.uid);

    await setDoc(answerRef, { answer, answeredAt: serverTimestamp() });

    // 全員回答したか確認
    const [players, answers] = await Promise.all([
      getDocs(collection(db, 'rooms', state.roomId, 'players')),
      getDocs(collection(db, 'rooms', state.roomId, 'rounds', roundId, 'answers')),
    ]);

    if (answers.size >= players.size) {
      await advanceToPredicting(roomRef, roomData, answers.docs);
    }
  }

  // 提出済みの回答だけを集計してPREDICTINGへ遷移させる共通処理。
  // 全員回答時（submitAnswer）と、タイムアウト強制確定（forceAdvanceFromAnswering）の両方から呼ばれる。
  async function advanceToPredicting(roomRef, roomData, answerDocs) {
    const q = roomData.currentQuestion;
    const counts = {};
    q.options.forEach(o => counts[o] = 0);
    answerDocs.forEach(d => {
      const a = d.data().answer;
      if (a in counts) counts[a]++;
    });
    await updateDoc(roomRef, { status: 'PREDICTING', answerCounts: counts, phaseStartedAt: serverTimestamp() });
  }

  // ── 回答フェーズのタイムアウト強制確定（ホストのみ呼び出し） ──
  // answerSeconds + 猶予秒数が経過しても未提出者がいる場合、提出済みの回答だけで
  // PREDICTINGへ遷移させる。すでに全員回答済みで遷移済みの場合は何もしない。
  async function forceAdvanceFromAnswering() {
    const roomRef = doc(db, 'rooms', state.roomId);
    const roomSnap = await getDoc(roomRef);
    if (!roomSnap.exists()) return;
    const roomData = roomSnap.data();
    if (roomData.status !== 'ANSWERING') return; // すでに遷移済み

    const currentRound = roomData.currentRound;
    const roundId = roundDocId(roomData.gameCount, currentRound);
    const answers = await getDocs(collection(db, 'rooms', state.roomId, 'rounds', roundId, 'answers'));
    await advanceToPredicting(roomRef, roomData, answers.docs);
  }

  function renderPredicting(data) {
    const q = data.currentQuestion;
    document.getElementById('predict-round').textContent = `第${data.currentRound}問 / 全${data.totalRounds}問`;
    document.getElementById('predict-question').textContent = q.text;

    // 再入室時に既に予測送信済みなら、その値を入力欄へ復元する（Issue #49）。
    const prefill = state.myPrediction != null ? state.myPrediction : 0;
    const opts = document.getElementById('predict-options');
    opts.innerHTML = `
      <div style="margin-bottom:16px">
        <p style="margin-bottom:6px;font-weight:bold">「はい」を選んだ人は何人？</p>
        <div class="predict-input">
          <input type="number" id="pred-はい" min="0" max="20" value="${prefill}" style="width:80px">
          <span>人</span>
          <button class="btn-primary" style="width:auto;padding:10px 16px" onclick="submitPrediction('はい', parseInt(document.getElementById('pred-はい').value))">送信</button>
        </div>
      </div>
    `;

    // 再入室時に既に予測送信済みの場合、再入力を求めず送信済みの状態を直接表示する（Issue #49）。
    if (state.predictionSent) {
      document.querySelectorAll('#predict-options input, #predict-options button').forEach(el => el.disabled = true);
      document.getElementById('predict-sent').style.display = 'block';
    } else {
      document.getElementById('predict-sent').style.display = 'none';
    }
    showScreen('predicting');
  }

  async function submitPrediction(targetOption, predictedCount) {
    if (state.predictionSent) return;
    state.predictionSent = true;

    document.getElementById('predict-sent').style.display = 'block';
    document.querySelectorAll('#predict-options button').forEach(b => b.disabled = true);

    const roomRef = doc(db, 'rooms', state.roomId);
    const roomData = (await getDoc(roomRef)).data();
    const currentRound = roomData.currentRound;
    const roundId = roundDocId(roomData.gameCount, currentRound);
    const answerRef = doc(db, 'rooms', state.roomId, 'rounds', roundId, 'answers', state.uid);

    await updateDoc(answerRef, { prediction: predictedCount, targetOption, predictedAt: serverTimestamp() });

    // 全員予測したか確認
    const [players, answers] = await Promise.all([
      getDocs(collection(db, 'rooms', state.roomId, 'players')),
      getDocs(collection(db, 'rooms', state.roomId, 'rounds', roundId, 'answers')),
    ]);

    const predicted = answers.docs.filter(d => d.data().prediction !== undefined);
    if (predicted.size >= players.size || predicted.length >= players.size) {
      await finalizeRound(roomRef, roomData, currentRound, answers.docs);
    }
  }

  // ── 予測フェーズのタイムアウト強制確定（ホストのみ呼び出し） ──
  // predictSeconds + 猶予秒数が経過しても未提出者がいる場合、提出済みの予測だけで
  // ラウンドを確定させる。すでに全員予測済みで確定済みの場合は何もしない。
  async function forceFinalizeFromPredicting() {
    const roomRef = doc(db, 'rooms', state.roomId);
    const roomSnap = await getDoc(roomRef);
    if (!roomSnap.exists()) return;
    const roomData = roomSnap.data();
    if (roomData.status !== 'PREDICTING') return; // すでに確定済み

    const currentRound = roomData.currentRound;
    const roundId = roundDocId(roomData.gameCount, currentRound);
    const answers = await getDocs(collection(db, 'rooms', state.roomId, 'rounds', roundId, 'answers'));
    await finalizeRound(roomRef, roomData, currentRound, answers.docs);
  }

  // ── ホスト端末が回答・予測フェーズのタイムアウトを監視する ──
  // 基準時刻はFirestoreに保存されたサーバー時刻（phaseStartedAt）から算出するため、
  // 途中参加や画面復帰でこの関数が再実行されても残り時間はズレない。
  function scheduleHostTimeouts(data) {
    const startedAtMs = (data.phaseStartedAt && typeof data.phaseStartedAt.toMillis === 'function')
      ? data.phaseStartedAt.toMillis()
      : null;

    if (data.status === 'ANSWERING') {
      clearTimeout(state.predictingTimeoutTimer);
      state.predictingTimeoutTimer = null;

      const q = data.currentQuestion;
      if (!q || startedAtMs == null) return;
      const key = `ANSWERING:${data.currentRound}:${startedAtMs}`;
      if (state.lastScheduledTimeoutKey === key) return;
      state.lastScheduledTimeoutKey = key;

      const deadline = startedAtMs + (q.answerSeconds + TIMEOUT_GRACE_SECONDS) * 1000;
      clearTimeout(state.answeringTimeoutTimer);
      state.answeringTimeoutTimer = setTimeout(() => {
        forceAdvanceFromAnswering().catch(err => console.error('forceAdvanceFromAnswering failed', err));
      }, Math.max(0, deadline - Date.now()));
    } else if (data.status === 'PREDICTING') {
      clearTimeout(state.answeringTimeoutTimer);
      state.answeringTimeoutTimer = null;

      const q = data.currentQuestion;
      if (!q || startedAtMs == null) return;
      const key = `PREDICTING:${data.currentRound}:${startedAtMs}`;
      if (state.lastScheduledTimeoutKey === key) return;
      state.lastScheduledTimeoutKey = key;

      const deadline = startedAtMs + (q.predictSeconds + TIMEOUT_GRACE_SECONDS) * 1000;
      clearTimeout(state.predictingTimeoutTimer);
      state.predictingTimeoutTimer = setTimeout(() => {
        forceFinalizeFromPredicting().catch(err => console.error('forceFinalizeFromPredicting failed', err));
      }, Math.max(0, deadline - Date.now()));
    } else {
      clearTimeout(state.answeringTimeoutTimer);
      clearTimeout(state.predictingTimeoutTimer);
      state.answeringTimeoutTimer = null;
      state.predictingTimeoutTimer = null;
      state.lastScheduledTimeoutKey = null;
    }
  }

  async function finalizeRound(roomRef, roomData, currentRound, answerDocs) {
    const counts = roomData.answerCounts || {};
    const totalRounds = roomData.totalRounds || 5;

    // ニックネームを取得
    const playersSnap = await getDocs(collection(db, 'rooms', state.roomId, 'players'));
    const nicknameMap = {};
    playersSnap.docs.forEach(d => nicknameMap[d.id] = d.data().nickname || '');

    // 前ラウンドまでの累計スコアを取得（Android FirebaseRepository.finalizeRound と同一仕様。
    // Issue #27: Web単独/Android混在いずれでも totalScore = 前ラウンドまでの累計 + roundScore とする）。
    const prevTotals = roomData.cumulativeTotals || {};

    const updatePromises = [];
    const scores = answerDocs
      .filter(d => d.data().prediction !== undefined)
      .map(d => {
        const data = d.data();
        const actual = counts[data.targetOption] || 0;
        const predicted = data.prediction || 0;
        const roundScore = Math.max(0, 100 - Math.abs(predicted - actual) * 20);
        const totalScore = (prevTotals[d.id] || 0) + roundScore;

        updatePromises.push(updateDoc(d.ref, { roundScore, totalScore }));

        return { playerId: d.id, nickname: nicknameMap[d.id] || '', targetOption: data.targetOption, predictedCount: predicted, actualCount: actual, roundScore, totalScore };
      });
    await Promise.all(updatePromises);

    // 未提出だったプレイヤーは cumulativeTotals にエントリを残さない（Android と同じ挙動）。
    const newTotals = {};
    scores.forEach(s => { newTotals[s.playerId] = s.totalScore; });

    const isLast = currentRound >= totalRounds;
    if (isLast) {
      const sortedByTotal = [...scores].sort((a, b) => b.totalScore - a.totalScore);
      // 終了扱いになるので保持期限を「終了から24時間」に更新する（Issue #34）。
      await updateDoc(roomRef, {
        status: 'FINISHED', finalScores: sortedByTotal, cumulativeTotals: newTotals, finishedAt: serverTimestamp(),
        expireAt: expireAtAfterHours(ROOM_FINISHED_RETENTION_HOURS),
      });
    } else {
      const sortedByRound = [...scores].sort((a, b) => b.roundScore - a.roundScore);
      // ラウンド確定のたびに保持期限を延長する。遊び続けている限り実質失効しない（Issue #34）。
      await updateDoc(roomRef, {
        status: 'RESULT', roundScores: sortedByRound, cumulativeTotals: newTotals, nextRound: currentRound + 1,
        expireAt: expireAtAfterHours(ROOM_WAITING_RETENTION_HOURS),
      });
    }
  }

  async function advanceToNextRound(roomData) {
    const nextRound = roomData.nextRound;
    if (!nextRound) return;
    const questionQueue = roomData.questionQueue || ALL_QUESTIONS.slice(0, TOTAL_ROUNDS_PER_GAME);
    const nextQuestion = questionQueue[nextRound - 1];
    await updateDoc(doc(db, 'rooms', state.roomId), {
      status: 'ANSWERING', currentRound: nextRound,
      currentQuestion: nextQuestion, answerCounts: {}, roundScores: [],
      phaseStartedAt: serverTimestamp(),
    });
  }

  function renderResult(data) {
    document.getElementById('result-title').textContent = `第${data.currentRound}問 結果`;

    const q = data.currentQuestion;
    const counts = data.answerCounts || {};
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    document.getElementById('answer-counts').innerHTML = `
      <div class="question-card" style="margin-bottom:16px">
        <div class="question-text" style="font-size:16px;margin-bottom:12px">${q.text}</div>
        ${q.options.map(opt => {
          const n = counts[opt] || 0;
          const pct = total > 0 ? Math.round(n / total * 100) : 0;
          return `<div class="count-bar">
            <span>${opt}</span>
            <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
            <span class="num">${n}人</span>
          </div>`;
        }).join('')}
      </div>`;

    const scores = data.roundScores || [];
    const myScore = scores.find(s => s.playerId === state.uid);
    document.getElementById('my-score-card').innerHTML = myScore ? `
      <div class="score-card" style="background:var(--color-primary-container);margin-bottom:12px">
        ${myScore.roundScore === 100 ? '<p style="text-align:center;font-size:18px">🎯 パーフェクト！</p>' : ''}
        <p>あなたの予測: 「${myScore.targetOption}」が ${myScore.predictedCount}人</p>
        <p>実際: ${myScore.actualCount}人</p>
        <p style="font-size:24px;font-weight:bold;color:var(--color-primary);text-align:center">+${myScore.roundScore}点</p>
      </div>` : '';

    document.getElementById('result-scores').innerHTML = scores.map((s, i) => {
      const isMe = s.playerId === state.uid;
      const name = escapeHtml((s.nickname || s.playerId) + (isMe ? '（あなた）' : ''));
      // 累計点はAndroid（ResultScreen.kt の RankingRow）と同様、0点のときは表示しない。
      const totalLine = s.totalScore > 0
        ? `<div style="font-size:12px;color:var(--color-text-muted)">累計 ${s.totalScore}点</div>`
        : '';
      return `<div class="score-row" style="${isMe ? 'background:var(--color-primary-container)' : ''}">

        <span class="rank">${['🥇','🥈','🥉'][i] || (i+1)+'位'}</span>
        <div style="flex:1">
          <div>${name}</div>
          ${totalLine}
        </div>
        <span class="score-pts">+${s.roundScore}点</span>
      </div>`;
    }).join('');

    showScreen('result');
  }

  function renderFinished(data) {
    const scores = data.finalScores || [];
    document.getElementById('final-scores').innerHTML = scores.map((s, i) => {
      const isMe = s.playerId === state.uid;
      const name = escapeHtml((s.nickname || s.playerId) + (isMe ? '（あなた）' : ''));
      return `<div class="score-row" style="${isMe ? 'background:var(--color-primary-container)' : ''}">
        <span class="rank">${['🥇','🥈','🥉'][i] || (i+1)+'位'}</span>
        <span>${name}</span>
        <span class="score-pts">${s.totalScore}点</span>
      </div>`;
    }).join('');
    // 「もう一度遊ぶ」はホストにのみ表示（Android の FinishedScreen と同様）。
    document.getElementById('restart-btn').style.display = state.isHost ? 'block' : 'none';
    showScreen('finished');
  }

  function renderHostLeft() {
    showScreen('host-left');
  }

  // ── 再戦（同一ルームを再利用してもう一度遊ぶ、ホストのみ） ──
  // status を WAITING に戻す。observeRoom（onSnapshot）がその遷移を検知し、
  // 参加者側の画面も含めて自動で待機室へ戻す。category は引き継ぐ。
  // gameCount をインクリメントし、rounds/{gameCount}_{round} のドキュメントIDを次ゲームで
  // 変えることで、submitAnswer() の「すでに回答済みです」を防ぐ（Issue #17）。
  async function restartGame() {
    const roomRef = doc(db, 'rooms', state.roomId);
    const roomSnap = await getDoc(roomRef);
    if (!roomSnap.exists()) return;
    const roomData = roomSnap.data();
    if (roomData.status !== 'FINISHED') return;

    const prevGameCount = roomData.gameCount || 1;
    const lastQuestionId = roomData.currentQuestion ? roomData.currentQuestion.questionId : null;

    await updateDoc(roomRef, {
      status: 'WAITING',
      currentRound: 0,
      gameCount: prevGameCount + 1,
      questionQueue: deleteField(),
      currentQuestion: null,
      answerCounts: {},
      roundScores: [],
      finalScores: [],
      cumulativeTotals: {},
      nextRound: deleteField(),
      restartedAt: serverTimestamp(),
      lastPlayedQuestionId: lastQuestionId || deleteField(),
      // WAITING に戻るので保持期限も「未開始のまま放置」の基準（6時間）へ延長する（Issue #34）。
      expireAt: expireAtAfterHours(ROOM_WAITING_RETENTION_HOURS),
    });
  }

  // 「トップに戻る」（screen-finished/screen-host-left）・待合室の「退室する」から
  // 共通で呼ばれる。参加者（ホスト以外）の場合は、ローカル状態を破棄する前に
  // 自分のplayersドキュメントをFirestoreから削除する（Issue #33）。
  // ホストはここでは削除しない（ホスト離脱はハートビート停止検知の経路に一本化する）。
  function resetGame() {
    // 明示的な離脱なので、以後の「ルームXXXXXXXXに戻る」導線も破棄する（Issue #49）。
    clearLastRoom();

    if (!state.isHost) {
      leaveRoom();
    }

    if (state.roomUnsub) state.roomUnsub();
    if (state.playersUnsub) state.playersUnsub();
    clearTimeout(state.autoAdvanceTimer);
    clearTimeout(state.answeringTimeoutTimer);
    clearTimeout(state.predictingTimeoutTimer);
    clearInterval(state.hostHeartbeatInterval);
    clearTimeout(state.hostLeftCheckTimer);
    state = { ...state, roomId: null, isHost: false, nickname: '', selectedAnswer: null,
      predictionSent: false, myPrediction: null, justRejoined: false,
      currentPhase: null, currentRound: 0, roomUnsub: null, playersUnsub: null,
      answeringTimeoutTimer: null, predictingTimeoutTimer: null, lastScheduledTimeoutKey: null,
      hostHeartbeatInterval: null, hostLeftCheckTimer: null, lastScheduledHeartbeatAt: null };
    document.getElementById('rejoin-banner').style.display = 'none';
    showScreen('home');
  }
</script>
</body>
</html>
