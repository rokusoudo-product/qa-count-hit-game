name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  logic-tests:
    name: ロジック単体テスト
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # backend/test_logic.py は Firestore に依存しないため追加の依存インストールは不要。
      # backend/test_functions.py は本番Firestoreに直接書き込むスクリプトのため、
      # CIでは意図的に実行しない（backend/CLAUDE.md 参照）。
      - name: Run logic unit tests
        run: python3 backend/test_logic.py

      # 質問マスタ（shared/questions.json）と Kotlin/JS/Python 3実装の同期を検証する（Issue #16）。
      # generate_questions.py --check を内部で呼ぶため、正本を更新して再生成し忘れた場合に失敗する。
      - name: Run question master sync test
        run: python3 backend/test_questions_sync.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      # 既存コードベースにlint設定がなかったため今回導入。
      # 1本目: 構文エラー・未定義名などの実害があるものだけを検出して失敗させる。
      - name: Lint Python (errors)
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 \
            --extend-exclude=backend/functions/venv \
            --show-source --statistics

      # 2本目: スタイル面は現時点では警告のみ（exit-zero）とし、既存コードを壊さない。
      - name: Lint Python (style, non-blocking)
        run: |
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 \
            --extend-exclude=backend/functions/venv \
            --statistics

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/rules-tests/package-lock.json

      - name: Install rules-tests dependencies
        run: npm --prefix backend/rules-tests ci

      # backend/rules-tests に lint 設定（lintスクリプト）が追加された場合のみ実行される。
      # 現時点では未設定のため no-op。
      - name: Lint JS (rules-tests, if configured)
        run: npm --prefix backend/rules-tests run lint --if-present

  rules-tests:
    name: Firestoreルールテスト（Emulator）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/rules-tests/package-lock.json

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install rules-tests dependencies
        run: npm --prefix backend/rules-tests ci

      # rules.test.mjs（権限マトリクス24件）+ gameflow.test.mjs（実ゲームフロー8件）= 32件
      - name: Run Firestore rules tests (emulator)
        run: npm --prefix backend/rules-tests run test:emulator

  room-expiry-tests:
    name: ルーム保持期限・自動削除テスト（Emulator）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # backend/functions/main.py（delete_expired_rooms が呼ぶ recursive_delete 等）を
      # test_room_expiry.py から直接importして検証するため、functions/ の依存を
      # システムのPython 3.12 側にインストールする（backend/functions/venv には依存しない）。
      - name: Install functions dependencies
        run: pip install -r backend/functions/requirements.txt

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # expireAt を過ぎたルームが players/rounds/rounds/*/answers を含めて
      # 再帰削除されること・期限内ルームが削除されないことを検証する（Issue #34）。
      - name: Run room expiry tests (emulator)
        run: |
          cd backend
          firebase emulators:exec --project hitokazu-game --only firestore \
            "FIRESTORE_EMULATOR_HOST=localhost:8080 python3 test_room_expiry.py"
